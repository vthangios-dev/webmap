<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>Web Map</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="/style.webmap-r12.css" />
  </head>
  <body>
    <main class="shell">
      <header class="masthead">
        <div class="title-wrap">
          <a href="/webmap/" class="brand">WEB MAP</a>
          <p class="subtitle"><i class="bi bi-activity"></i> Realtime Tactical Stream</p>
        </div>
        <div class="head-actions">
          <button id="compact" class="control-btn">
            <i class="bi bi-layout-sidebar-inset"></i>
            <span class="btn-text">Compact</span>
          </button>
          <button id="popup" class="control-btn emphasis">
            <i class="bi bi-window"></i>
            <span class="btn-text">Cửa sổ nổi</span>
          </button>
        </div>
      </header>

      <p id="android-pip-help" class="android-note" hidden>
        <i class="bi bi-phone"></i> Android: bật PiP / cửa sổ nổi trong Chrome rồi chuyển sang game.
      </p>

      <section class="workspace">
        <article id="map-panel" class="arena map-panel">
          <div class="arena-top">
            <div class="arena-meta">
              <span class="status-live offline"><i class="bi bi-broadcast-pin"></i> OFFLINE</span>
              <h1>Realtime Map Feed</h1>
              <p id="perspective">Chờ luồng từ iPhone</p>
            </div>
            <div class="arena-actions">
              <button id="expand" class="control-btn expand" title="Mở rộng">
                <i class="bi bi-arrows-angle-expand"></i>
                <span class="btn-text">Expand</span>
              </button>
              <button id="pip" class="control-btn" title="Nổi trên ứng dụng">
                <i class="bi bi-pip"></i>
                <span class="btn-text">PiP</span>
              </button>
              <button id="fullscreen" class="control-btn" title="Toàn màn hình">
                <i class="bi bi-bounding-box-circles"></i>
                <span class="btn-text">Fullscreen</span>
              </button>
            </div>
          </div>

          <p id="notice" class="warning-bar" role="status" hidden></p>

          <div class="frame">
            <canvas id="map" width="900" height="900"></canvas>
            <div class="map-message" id="map-message">Chờ iPhone phát bản đồ</div>
          </div>
        </article>

        <aside class="intel-card">
          <h2><i class="bi bi-grid-3x3-gap-fill"></i> Session Intel</h2>
          <dl>
            <div><dt><i class="bi bi-key-fill"></i> Mã phòng</dt><dd id="room">—</dd></div>
            <div><dt><i class="bi bi-plug-fill"></i> Trạng thái</dt><dd id="status">Chưa kết nối</dd></div>
            <div><dt><i class="bi bi-lightning-charge-fill"></i> Kết nối web</dt><dd id="latency">— ms</dd></div>
            <div><dt><i class="bi bi-clock-history"></i> Bản đồ</dt><dd id="age">Chưa có dữ liệu</dd></div>
          </dl>
          <p class="share-caption">Link chia sẻ</p>
          <code id="share-url">—</code>
          <button id="copy-link" class="control-btn copy">
            <i class="bi bi-copy"></i>
            <span class="btn-text">Copy Link</span>
          </button>
        </aside>
      </section>

      <form id="joinForm" class="hidden-form" aria-hidden="true">
        <input
          id="code"
          minlength="6"
          maxlength="6"
          pattern="[A-Za-z0-9]{6}"
          placeholder="6 ký tự"
          autocomplete="off"
          autocapitalize="characters"
        />
        <button type="submit">Xem</button>
        <button type="button" id="reset-room">Reset</button>
      </form>
    </main>
    <script src="/app.webmap-r12.js"></script>
  </body>
</html>
